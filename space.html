<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>nagz.space</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
<style>
  :root {
    --void: #04020a;
    --deep: #0d0620;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--void);
  }
  /* Fallback sky if WebGL is unavailable */
  body {
    background:
      radial-gradient(ellipse 70% 45% at 62% 40%, rgba(88, 36, 140, .35), transparent 70%),
      radial-gradient(ellipse 50% 40% at 25% 70%, rgba(40, 30, 110, .30), transparent 70%),
      var(--void);
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #sky { opacity: 0; transition: opacity 3.2s cubic-bezier(.2,.6,.2,1); }
  #sky.ready { opacity: 1; }
  #meteors { pointer-events: none; mix-blend-mode: screen; }
  /* soft optical vignette */
  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse 120% 95% at 50% 50%, transparent 55%, rgba(2, 0, 6, .75) 100%);
  }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<canvas id="meteors" aria-hidden="true"></canvas>
<div class="vignette"></div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('sky');
  const gl = canvas.getContext('webgl', { antialias: false, alpha: false, premultipliedAlpha: false, powerPreference: 'high-performance' });
  if (!gl) return; // CSS fallback gradient stays visible

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- seeded random so the sky is the same on every visit ----------
  let seed = 1337;
  const rand = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const gauss = () => { let u = 0, v = 0; while (!u) u = rand(); while (!v) v = rand(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const norm = (v) => { const l = Math.hypot(v[0], v[1], v[2]); return [v[0] / l, v[1] / l, v[2] / l]; };
  const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
  const randomDir = () => norm([gauss(), gauss(), gauss()]);

  // The "galactic plane": a tilted great circle that stars and nebula gather along
  const bandN = norm([0.28, 0.93, 0.22]);
  const bandU = norm(cross(bandN, [0, 0, 1]));
  const bandV = cross(bandN, bandU);

  // ---------- shader helpers ----------
  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); return null; }
    return s;
  }
  function program(vs, fs) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(p)); return null; }
    const u = {};
    const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) { const name = gl.getActiveUniform(p, i).name; u[name] = gl.getUniformLocation(p, name); }
    return { p, u };
  }

  const PROJECT = `
    uniform mat3 uView;
    uniform float uF;
    uniform float uAspect;
    vec4 project(vec3 world) {
      vec3 v = uView * world;
      if (v.z > -0.02) return vec4(9.0, 9.0, 9.0, 1.0);
      return vec4(v.x / -v.z * uF / uAspect, v.y / -v.z * uF, 0.0, 1.0);
    }`;

  // ---------- 1. Nebula: fullscreen quad sampling 3D noise on the sky sphere ----------
  const nebula = program(`
    attribute vec2 aPos;
    varying vec2 vNdc;
    void main() { vNdc = aPos; gl_Position = vec4(aPos, 0.0, 1.0); }
  `, `
    precision highp float;
    varying vec2 vNdc;
    uniform mat3 uView;
    uniform float uF, uAspect, uTime;
    uniform vec3 uBand;

    float hash(vec3 p) {
      p = fract(p * 0.3183099 + 0.1);
      p *= 17.0;
      return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
    }
    float noise(vec3 x) {
      vec3 i = floor(x); vec3 f = fract(x);
      f = f * f * (3.0 - 2.0 * f);
      return mix(mix(mix(hash(i + vec3(0,0,0)), hash(i + vec3(1,0,0)), f.x),
                     mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
                 mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
                     mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z);
    }
    float fbm(vec3 p) {
      float a = 0.5, s = 0.0;
      for (int i = 0; i < 5; i++) { s += a * noise(p); p = p * 2.03 + vec3(1.7, 9.2, 4.1); a *= 0.5; }
      return s;
    }

    void main() {
      vec3 d = normalize(vec3(vNdc.x * uAspect / uF, vNdc.y / uF, -1.0));
      vec3 dir = d * uView;                       // camera -> world
      float t = uTime * 0.006;

      // domain-warped clouds, drifting almost imperceptibly
      vec3 p = dir * 2.4;
      vec3 w = vec3(fbm(p + vec3(0.0, t, 0.0)), fbm(p + vec3(5.2, 1.3, -t)), fbm(p + vec3(-3.1, t * 0.7, 2.8)));
      float n  = fbm(p * 1.1 + w * 1.6 + vec3(t * 0.5));
      float n2 = fbm(p * 2.6 - w * 0.9 + 11.0);

      // concentrate along the galactic band, keep faint wisps elsewhere
      float lat  = dot(dir, uBand);
      float band = exp(-lat * lat / 0.09);
      float cloud = smoothstep(0.35, 0.85, n) * (0.25 + 0.95 * band);
      float glow  = smoothstep(0.45, 0.95, n2) * band;

      // dark dust lanes that obscure the band
      float dust = smoothstep(0.52, 0.72, fbm(p * 3.4 + w * 2.0 - 4.0)) * band;

      vec3 base    = vec3(0.012, 0.006, 0.030);
      vec3 violet  = vec3(0.30, 0.10, 0.52);
      vec3 magenta = vec3(0.55, 0.14, 0.46);
      vec3 indigo  = vec3(0.10, 0.12, 0.42);
      vec3 rose    = vec3(0.85, 0.42, 0.72);

      vec3 col = base;
      col += mix(indigo, violet, smoothstep(0.3, 0.7, w.x)) * cloud * 0.55;
      col += mix(violet, magenta, w.y) * cloud * cloud * 0.45;
      col += rose * glow * glow * 0.22;
      col += vec3(0.20, 0.10, 0.30) * band * 0.06;  // faint diffuse band light
      col *= 1.0 - dust * 0.75;

      // triangular dither kills banding in the dark gradients
      float r = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453)
              + fract(sin(dot(gl_FragCoord.xy, vec2(93.989, 67.345))) * 24634.6345) - 1.0;
      col += r / 255.0;
      gl_FragColor = vec4(col, 1.0);
    }
  `);

  // ---------- 2. Stars ----------
  const stars = program(`
    attribute vec3 aPos;
    attribute float aSize;
    attribute vec3 aColor;
    attribute vec2 aTw;
    uniform float uTime, uDpr;
    varying vec3 vColor;
    varying float vAlpha;
    varying float vSpike;
    ${PROJECT}
    void main() {
      gl_Position = project(aPos);
      float tw = 0.72 + 0.28 * sin(uTime * aTw.y + aTw.x) * sin(uTime * aTw.y * 0.37 + aTw.x * 2.1);
      gl_PointSize = max(aSize * uDpr * (0.9 + 0.2 * tw), 1.5);
      vColor = aColor;
      vAlpha = tw;
      vSpike = step(6.0, aSize);
    }
  `, `
    precision mediump float;
    varying vec3 vColor;
    varying float vAlpha;
    varying float vSpike;
    void main() {
      vec2 c = gl_PointCoord - 0.5;
      float d2 = dot(c, c);
      float core = exp(-d2 * 90.0);
      float halo = exp(-d2 * 14.0) * 0.28;
      float spikes = vSpike * (exp(-abs(c.x) * 70.0) * exp(-abs(c.y) * 7.0)
                             + exp(-abs(c.y) * 70.0) * exp(-abs(c.x) * 7.0)) * 0.55;
      float a = (core + halo + spikes) * vAlpha;
      gl_FragColor = vec4(vColor * a, 1.0);
    }
  `);

  const STAR_COUNT = 9500;
  const starData = new Float32Array(STAR_COUNT * 9);
  const palette = [
    [0.80, 0.84, 1.00], // blue-white
    [1.00, 0.97, 0.95], // white
    [0.86, 0.74, 1.00], // lavender
    [1.00, 0.86, 0.78], // warm
    [0.70, 0.62, 1.00], // violet
  ];
  for (let i = 0; i < STAR_COUNT; i++) {
    let dir;
    if (rand() < 0.55) {
      // gather along the band
      const th = rand() * Math.PI * 2, lat = gauss() * 0.16;
      dir = norm([
        bandU[0]*Math.cos(th) + bandV[0]*Math.sin(th) + bandN[0]*lat,
        bandU[1]*Math.cos(th) + bandV[1]*Math.sin(th) + bandN[1]*lat,
        bandU[2]*Math.cos(th) + bandV[2]*Math.sin(th) + bandN[2]*lat,
      ]);
    } else dir = randomDir();

    const m = Math.pow(rand(), 5.5);            // most stars faint, a handful bright
    const size = 1.6 + m * 9.5;
    const bright = 0.18 + m * 1.3 + rand() * 0.25;
    const c = palette[(rand() * palette.length) | 0];
    const o = i * 9;
    starData.set([dir[0], dir[1], dir[2], size, c[0]*bright, c[1]*bright, c[2]*bright, rand() * 6.283, 0.3 + rand() * 1.8], o);
  }
  const starBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, starBuf);
  gl.bufferData(gl.ARRAY_BUFFER, starData, gl.STATIC_DRAW);

  // ---------- 3. Spiral galaxies, distant and a little hazy ----------
  const galaxy = program(`
    attribute vec3 aLocal;   // radius, angle, height
    attribute vec3 aColor;
    attribute float aSize;
    uniform vec3 uCenter, uAx, uAy, uAz;
    uniform float uTime, uSpin, uDpr;
    varying vec3 vColor;
    ${PROJECT}
    void main() {
      float ang = aLocal.y + uTime * uSpin;
      vec3 l = vec3(cos(ang) * aLocal.x, sin(ang) * aLocal.x, aLocal.z);
      gl_Position = project(uCenter + uAx * l.x + uAy * l.y + uAz * l.z);
      gl_PointSize = aSize * uDpr;
      vColor = aColor;
    }
  `, `
    precision mediump float;
    varying vec3 vColor;
    void main() {
      vec2 c = gl_PointCoord - 0.5;
      float a = exp(-dot(c, c) * 18.0);
      gl_FragColor = vec4(vColor * a, 1.0);
    }
  `);

  const galaxies = [
    { dir: [0.30, 0.16, -1.0], size: 0.28, tilt: 1.05, turn: 0.4, arms: 2, spin:  0.010, hue: 0 },
    { dir: [-0.62, -0.30, -1.0], size: 0.13, tilt: 0.55, turn: 2.2, arms: 3, spin: -0.014, hue: 1 },
    { dir: [1.0, -0.25, -0.35], size: 0.20, tilt: 1.30, turn: 1.1, arms: 2, spin:  0.012, hue: 2 },
    { dir: [-1.0, 0.35, 0.40], size: 0.22, tilt: 0.80, turn: 2.9, arms: 4, spin: -0.009, hue: 0 },
    { dir: [0.15, -0.20, 1.0], size: 0.18, tilt: 0.30, turn: 0.7, arms: 2, spin:  0.011, hue: 1 },
  ];
  const armCols = [
    [[0.55, 0.35, 0.95], [0.80, 0.45, 0.90]],
    [[0.40, 0.45, 1.00], [0.62, 0.40, 1.00]],
    [[0.75, 0.40, 0.85], [0.95, 0.55, 0.80]],
  ];
  const PER = 4200;
  const galData = new Float32Array(galaxies.length * PER * 7);
  let k = 0;
  galaxies.forEach((g) => {
    const C = norm(g.dir);
    // disc basis: start tangent to the sky, then tilt it
    let t1 = norm(cross(C, Math.abs(C[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0]));
    let t2 = cross(C, t1);
    const ct = Math.cos(g.turn), st = Math.sin(g.turn);
    [t1, t2] = [t1.map((v, i) => v * ct + t2[i] * st), t2.map((v, i) => -t1[i] * st + v * ct)];
    const ci = Math.cos(g.tilt), si = Math.sin(g.tilt);
    const ax = t1.map((v) => v * g.size);
    const ay = t2.map((v, i) => (v * ci + C[i] * si) * g.size);
    const az = t2.map((v, i) => (-v * si + C[i] * ci) * g.size);
    g.center = C; g.ax = ax; g.ay = ay; g.az = az;

    const [armA, armB] = armCols[g.hue];
    for (let i = 0; i < PER; i++) {
      let r, ang, h, col, size;
      const roll = rand();
      if (roll < 0.14) {
        // bulge
        r = Math.abs(gauss()) * 0.09;
        ang = rand() * Math.PI * 2;
        h = gauss() * 0.05;
        const b = 0.030 + rand() * 0.035;
        col = [1.0 * b, 0.85 * b, 0.80 * b];
        size = 4 + rand() * 7;
        if (rand() < 0.25) { col = col.map((v) => v * 0.3); size = 18 + rand() * 20; } // core glow
      } else {
        r = 0.08 + Math.pow(rand(), 0.9) * 0.92;
        const arm = Math.floor(rand() * g.arms);
        ang = arm * Math.PI * 2 / g.arms + Math.log(r + 0.05) * 2.6 + gauss() * (0.28 + 0.2 * r);
        h = gauss() * 0.025;
        const mixT = rand();
        const fade = (1 - r * 0.6) * (0.09 + rand() * 0.13);
        col = armA.map((v, j) => (v * (1 - mixT) + armB[j] * mixT) * fade);
        size = 2.2 + rand() * 4;
        if (rand() < 0.35) { col = col.map((v) => v * 0.28); size = 10 + rand() * 14; } // diffuse haze
        else if (rand() < 0.03) { col = [0.55, 0.22, 0.45]; size = 4; }  // pink star-forming knots
      }
      galData.set([r, ang, h, col[0], col[1], col[2], size], k);
      k += 7;
    }
  });
  const galBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, galBuf);
  gl.bufferData(gl.ARRAY_BUFFER, galData, gl.STATIC_DRAW);

  const quadBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

  // ---------- camera ----------
  const DEG = Math.PI / 180;
  const FOV = 62 * DEG;
  const F = 1 / Math.tan(FOV / 2);
  let W = 0, H = 0, dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 1.75);
    W = Math.floor(window.innerWidth * dpr);
    H = Math.floor(window.innerHeight * dpr);
    canvas.width = W; canvas.height = H;
    meteorCanvas.width = W; meteorCanvas.height = H;
    gl.viewport(0, 0, W, H);
  }

  // world -> camera: roll * pitch * yaw, returned column-major for GL
  function viewMatrix(yaw, pitch, roll) {
    const cy = Math.cos(yaw), sy = Math.sin(yaw);
    const cp = Math.cos(pitch), sp = Math.sin(pitch);
    const cr = Math.cos(roll), sr = Math.sin(roll);
    const Ry = [[cy, 0, sy], [0, 1, 0], [-sy, 0, cy]];
    const Rx = [[1, 0, 0], [0, cp, -sp], [0, sp, cp]];
    const Rz = [[cr, -sr, 0], [sr, cr, 0], [0, 0, 1]];
    const mul = (A, B) => A.map((row) => [0, 1, 2].map((j) => row[0]*B[0][j] + row[1]*B[1][j] + row[2]*B[2][j]));
    const M = mul(Rz, mul(Rx, Ry));
    return new Float32Array([M[0][0], M[1][0], M[2][0], M[0][1], M[1][1], M[2][1], M[0][2], M[1][2], M[2][2]]);
  }

  // mouse / touch → target offset, eased with inertia
  const target = { x: 0, y: 0 }, cur = { x: 0, y: 0 };
  const influence = reduceMotion ? 0.35 : 1;
  window.addEventListener('pointermove', (e) => {
    target.x = (e.clientX / window.innerWidth - 0.5) * 2;
    target.y = (e.clientY / window.innerHeight - 0.5) * 2;
  }, { passive: true });
  document.addEventListener('pointerleave', () => { target.x = 0; target.y = 0; });

  // ---------- meteors: rare, faint, on a 2D overlay ----------
  const meteorCanvas = document.getElementById('meteors');
  const mctx = meteorCanvas.getContext('2d');
  const meteors = [];
  let nextMeteor = 6 + Math.random() * 8;
  function spawnMeteor() {
    const ang = (20 + Math.random() * 40) * DEG * (Math.random() < 0.5 ? 1 : -1) + Math.PI / 2;
    meteors.push({
      x: Math.random() * W, y: Math.random() * H * 0.5,
      vx: Math.cos(ang) * (Math.random() < 0.5 ? 1 : -1), vy: Math.sin(ang),
      speed: (500 + Math.random() * 500) * dpr, life: 0, max: 0.9 + Math.random() * 0.6,
      len: (120 + Math.random() * 160) * dpr,
    });
  }
  function drawMeteors(dt) {
    mctx.clearRect(0, 0, W, H);
    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i];
      m.life += dt;
      const p = m.life / m.max;
      if (p >= 1) { meteors.splice(i, 1); continue; }
      m.x += m.vx * m.speed * dt; m.y += m.vy * m.speed * dt;
      const a = Math.sin(p * Math.PI) * 0.55;
      const tx = m.x - m.vx * m.len, ty = m.y - m.vy * m.len;
      const g = mctx.createLinearGradient(m.x, m.y, tx, ty);
      g.addColorStop(0, `rgba(240, 225, 255, ${a})`);
      g.addColorStop(0.25, `rgba(170, 130, 255, ${a * 0.45})`);
      g.addColorStop(1, 'rgba(120, 60, 200, 0)');
      mctx.strokeStyle = g;
      mctx.lineWidth = 1.3 * dpr;
      mctx.lineCap = 'round';
      mctx.beginPath(); mctx.moveTo(m.x, m.y); mctx.lineTo(tx, ty); mctx.stroke();
    }
  }

  // ---------- attribute binding ----------
  function attr(prog, name, size, stride, offset) {
    const loc = gl.getAttribLocation(prog, name);
    if (loc < 0) return;
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, size, gl.FLOAT, false, stride * 4, offset * 4);
  }
  function disableAll() { for (let i = 0; i < 8; i++) gl.disableVertexAttribArray(i); }

  // ---------- loop ----------
  let last = performance.now(), time = 0, running = true;
  const drift = reduceMotion ? 0.05 : 0.22;                    // degrees per second of slow yaw

  function frame(now) {
    if (!running) return;
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    time += dt;

    const ease = 1 - Math.exp(-dt * 1.4);
    cur.x += (target.x - cur.x) * ease;
    cur.y += (target.y - cur.y) * ease;

    const yaw   = (time * drift + Math.sin(time * 0.031) * 1.5 + cur.x * 5.5 * influence) * DEG;
    const pitch = (Math.sin(time * 0.023) * 1.2 + cur.y * 3.5 * influence) * DEG;
    const roll  = (Math.sin(time * 0.017) * 0.8 - cur.x * 0.8 * influence) * DEG;
    const view = viewMatrix(yaw, pitch, roll);
    const aspect = W / H;

    gl.disable(gl.BLEND);

    // nebula
    gl.useProgram(nebula.p);
    disableAll();
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
    attr(nebula.p, 'aPos', 2, 2, 0);
    gl.uniformMatrix3fv(nebula.u.uView, false, view);
    gl.uniform1f(nebula.u.uF, F);
    gl.uniform1f(nebula.u.uAspect, aspect);
    gl.uniform1f(nebula.u.uTime, time);
    gl.uniform3fv(nebula.u.uBand, bandN);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);

    // galaxies
    gl.useProgram(galaxy.p);
    disableAll();
    gl.bindBuffer(gl.ARRAY_BUFFER, galBuf);
    attr(galaxy.p, 'aLocal', 3, 7, 0);
    attr(galaxy.p, 'aColor', 3, 7, 3);
    attr(galaxy.p, 'aSize', 1, 7, 6);
    gl.uniformMatrix3fv(galaxy.u.uView, false, view);
    gl.uniform1f(galaxy.u.uF, F);
    gl.uniform1f(galaxy.u.uAspect, aspect);
    gl.uniform1f(galaxy.u.uTime, time);
    gl.uniform1f(galaxy.u.uDpr, dpr);
    galaxies.forEach((g, i) => {
      gl.uniform3fv(galaxy.u.uCenter, g.center);
      gl.uniform3fv(galaxy.u.uAx, g.ax);
      gl.uniform3fv(galaxy.u.uAy, g.ay);
      gl.uniform3fv(galaxy.u.uAz, g.az);
      gl.uniform1f(galaxy.u.uSpin, reduceMotion ? 0 : g.spin);
      gl.drawArrays(gl.POINTS, i * PER, PER);
    });

    // stars
    gl.useProgram(stars.p);
    disableAll();
    gl.bindBuffer(gl.ARRAY_BUFFER, starBuf);
    attr(stars.p, 'aPos', 3, 9, 0);
    attr(stars.p, 'aSize', 1, 9, 3);
    attr(stars.p, 'aColor', 3, 9, 4);
    attr(stars.p, 'aTw', 2, 9, 7);
    gl.uniformMatrix3fv(stars.u.uView, false, view);
    gl.uniform1f(stars.u.uF, F);
    gl.uniform1f(stars.u.uAspect, aspect);
    gl.uniform1f(stars.u.uTime, reduceMotion ? 0 : time);
    gl.uniform1f(stars.u.uDpr, dpr);
    gl.drawArrays(gl.POINTS, 0, STAR_COUNT);

    if (!reduceMotion) {
      nextMeteor -= dt;
      if (nextMeteor <= 0) { spawnMeteor(); nextMeteor = 9 + Math.random() * 16; }
      drawMeteors(dt);
    }

    requestAnimationFrame(frame);
  }

  document.addEventListener('visibilitychange', () => {
    running = !document.hidden;
    if (running) { last = performance.now(); requestAnimationFrame(frame); }
  });
  window.addEventListener('resize', resize);

  resize();
  requestAnimationFrame((t) => { last = t; frame(t); canvas.classList.add('ready'); });
})();
</script>
</body>
</html>
